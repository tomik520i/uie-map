name: Testy prototypu

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Čtení světa a renderer
        run: python -m unittest test_reader test_offline_renderer test_world_hires test_colormap_determinism.ColorDeterminismTests
      - name: Kolizní export a obnova
        run: python -m unittest test_collision_world_store test_collision_region_noop test_collision_world_region test_collision_world_runner test_collision_world_watch test_collision_pair_stage test_collision_region_probe
      - name: Porovnání geometrie a barev generací
        run: python -m unittest test_surface_color_diff
      - name: Příkaz údržby a profil celosvětového exportu
        run: python -m unittest test_collision_world_gc_cli test_collision_world_gc_profile test_collision_maintenance_integration test_collision_world_gc_init
      - name: Registry bloků nesmí být přepsány souřadnicemi
        run: python -m unittest test_registry_placeholder_parsing test_registry_history
      - name: Jeskynní limity a obnova publikace
        run: python -m unittest test_cave_full_limits test_cave_full_render test_cave_full_integration test_cave_batch_integration
      - name: Nezávislé ověření kompletní jeskynní generace
        run: python -m unittest test_cave_release_verify test_cave_pair test_cave_pair_index
      - name: Rozpoznání dimenzí bez zápisu do světa
        run: python -m unittest test_world_layout test_uiemap_config test_uiemap_render test_uiemap_serve test_uiemap_cli
      - name: Oddělení dimenzí a ochrana publikace
        run: python -m unittest test_dimension_binding test_dimension_renderer test_hires_lock_wait test_hires_publish_tick test_hires_bundle
      - name: Retence a bezpečné publikování
        run: python -m unittest test_collision_world_retention test_collision_world_store test_collision_world_gc test_collision_gc test_collision_retention
      - name: Webový prohlížeč a HTTP rozhraní
        run: node --test test_*.mjs
